ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; 默认出口和手动选节点。
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 手动切换`[]🇨🇳 大陆节点`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]DIRECT
custom_proxy_group=🚀 手动切换`select`(?i)^(?!.*(?:剩余流量|流量剩余|套餐到期|到期时间|流量重置|官网地址|traffic left|expiry date)).+
custom_proxy_group=♻️ 自动选择`url-test`(?i)^(?!.*(?:剩余流量|流量剩余|套餐到期|到期时间|流量重置|官网地址|traffic left|expiry date)).+`https://cp.cloudflare.com/generate_204`600,,50

; 谷歌服务和其他 AI 各自钉选具体节点，Google 登录链路全程使用同一出口。
custom_proxy_group=🔍 谷歌服务`select`(?i)^(?!.*(?:香港|澳门|大陆|中国|回国|🇭🇰|🇲🇴|🇨🇳)).*(家庭宽带|家宽|住宅|residential)`(?i)(美国|日本|新加坡|United States|Japan|Singapore|🇺🇸|🇯🇵|🇸🇬|\b(US|JP|SG)\b)`[]🚀 手动切换
custom_proxy_group=🤖 AI`select`(?i)(美国|日本|新加坡|United States|Japan|Singapore|🇺🇸|🇯🇵|🇸🇬|\b(US|JP|SG)\b)`[]🚀 手动切换

custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🧭 组网`select`[]DIRECT`[]🚀 手动切换
custom_proxy_group=🎯 公司地址`select`[]DIRECT`[]🚀 手动切换
custom_proxy_group=💱 交易所`select`[]🚀 节点选择`[]🚀 手动切换`[]DIRECT
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🇭🇰 香港节点`[]🚀 手动切换
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]🚀 手动切换
custom_proxy_group=🎥 奈飞视频`select`(?i)(奈飞|Netflix|\bNF\b)`[]🚀 节点选择`[]🚀 手动切换
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]🚀 手动切换

custom_proxy_group=🇨🇳 大陆节点`url-test`(?i)^(?!.*(🇭🇰|🇲🇴|🇹🇼|🇺🇸|🇯🇵|🇸🇬)).*(大陆|回国|内地|中国|🇨🇳|\b(CN|China)\b)`http://connectivitycheck.platform.hicloud.com/generate_204`900,,50
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(香港|🇭🇰|Hong ?Kong|\bHK\b)`https://cp.cloudflare.com/generate_204`900,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)(新加坡|狮城|🇸🇬|Singapore|\bSG\b)`https://cp.cloudflare.com/generate_204`900,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)(日本|东京|大阪|🇯🇵|Japan|\bJP\b)`https://cp.cloudflare.com/generate_204`900,,50
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(美国|洛杉矶|圣何塞|西雅图|🇺🇸|United States|\bUS\b)`https://cp.cloudflare.com/generate_204`900,,50

enable_rule_generator=true
overwrite_original_rules=true

url_test=https://cp.cloudflare.com/generate_204
url_test_timeout=3000

clash_rule_base=https://raw.githubusercontent.com/Alex-lsky/ACL4SSR/main/GeneralClashConfig.yml
