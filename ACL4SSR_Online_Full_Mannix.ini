[custom]

; 局域网和自定义例外优先于公共规则。
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🧭 组网,https://raw.githubusercontent.com/Alex-lsky/ACL4SSR/main/MyNetwork.list
ruleset=🎯 公司地址,https://raw.githubusercontent.com/Alex-lsky/ACL4SSR/main/ChinaOnly.list
; 上游 UnBan 把 dl.google.com 直连，下载链路随其他 Google 服务走「谷歌服务」分组。
ruleset=🔍 谷歌服务,[]DOMAIN,dl.google.com
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
